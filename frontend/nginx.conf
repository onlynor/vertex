server {
    listen 80;
    server_name _;

    # 训练视频上传：界面限制单个文件 100MB，这里留一点余量。
    client_max_body_size 120m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # /api/videos（不带斜杠的列表接口）字面上比 /api/videos/ 短一个字符，
    # 按理不该匹配下面这个前缀 location；但 nginx 对“前缀刚好等于请求路径+/”
    # 这种情况会自动 301 到带斜杠的版本，把列表接口也捎带处理了。站点用非 80
    # 端口跑时（反代/多端口场景）这个自动重定向生成的 Location 不带端口号，
    # 浏览器会跳到宿主机 80 端口上别的服务，页面表现为“接口 404、列表空白”。
    # 用精确匹配把列表接口摘出来，不让它落进下面的前缀匹配触发重定向。
    location = /api/videos {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 视频回放走 Range 请求，关掉缓冲才能边下边播。
    location /api/videos/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
        # 上传大视频、等 AI 出结果都可能比较久。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # AI 一键评价、生成评语一次要等十几秒到几分钟。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 打包产物带内容哈希，可以长期缓存；index.html 不缓存，保证发版后立刻生效。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
